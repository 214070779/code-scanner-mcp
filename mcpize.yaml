# MCPize Marketplace Configuration
# https://mcpize.com/docs/configuration

name: code-scanner
version: 0.1.0
description: Scan local codebases for hardcoded secrets, vulnerable dependencies, and insecure code patterns. Supports 24+ secret patterns, 45+ CVEs, and 20+ insecure code patterns across Python, JavaScript, TypeScript, Go, Rust, Java, and more.

transport: stdio
command: python3
args:
  - server.py

categories:
  - security
  - code-analysis
  - developer-tools

tags:
  - security
  - secrets
  - vulnerability-scanning
  - code-quality
  - static-analysis
  - devsecops

pricing:
  # Freemium: Free tier with limits, Pro for unlimited access
  - tier: Free
    description: Up to 10 scans per day, all detectors included
    price: 0
    features:
      - 10 scans per day
      - All 3 detectors (secrets, dependencies, code patterns)
      - Markdown & JSON output
      - Community support
    monthly_requests: 300

  - tier: Pro
    description: Unlimited scans, priority support, early access to new patterns
    price: 29
    features:
      - Unlimited scans
      - All 3 detectors
      - Priority support
      - Early access to new detection patterns
      - Custom pattern configuration
    monthly_requests: 10000

links:
  documentation: https://github.com/yourusername/code-scanner-mcp#readme
  repository: https://github.com/yourusername/code-scanner-mcp
  issues: https://github.com/yourusername/code-scanner-mcp/issues

# SEO metadata (auto-generated by `mcpize publish --auto`, override here if needed)
seo:
